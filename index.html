        event.target.style.display = "none";
        document.body.style.overflow = "auto";
    }
});

// কীবোর্ডের Escape বাটন চাপলে যাতে বন্ধ হয়
document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        const modals = document.querySelectorAll(".project-modal, .modal-overlay");
        modals.forEach(function(modal) {
            modal.style.display = "none";
        });
        document.body.style.overflow = "auto";
    }
});

function getPrimaryCategory(cat) {
    if (cat.includes("ieee")) return { name: "IEEE", class: "ieee" };
    if (cat.includes("cybersecurity")) return { name: "Cybersecurity", class: "cybersecurity" };
    if (cat.includes("programming")) return { name: "Programming / AI", class: "programming" };
    if (cat.includes("engineering")) return { name: "Engineering", class: "engineering" };
    if (cat.includes("english")) return { name: "English & Soft Skills", class: "english" };
    if (cat.includes("workshop")) return { name: "Workshop", class: "workshop" };
    return { name: "Other", class: "other" };
}

function renderCertificates(data) {
    const grid = document.getElementById('certGrid');
    if (!grid) return;
    grid.innerHTML = '';

    data.forEach(item => {
        const catInfo = getPrimaryCategory(item.category);
        const card = document.createElement('div');
        card.className = 'cert-card';
        card.setAttribute('data-category', item.category);
        card.setAttribute('data-year', item.year);
        
        card.onclick = () => openCertModal(item.title, item.org, item.date, item.img);

        card.innerHTML = `
            <div class="cert-thumb">
                <img src="${item.img}" alt="${item.title}" onerror="this.onerror=null; this.parentElement.classList.add('default-thumb'); this.parentElement.innerHTML='<i class=\\'fas fa-award\\'></i>';">
                <div class="cert-overlay"><i class="fas fa-eye"></i></div>
            </div>
            <div class="cert-info">
                <span class="cert-tag ${catInfo.class}">${catInfo.name}</span>
                <h3>${item.title}</h3>
                <p class="cert-org"><i class="fas fa-building"></i> ${item.org}</p>
                <span class="cert-date"><i class="far fa-calendar-alt"></i> ${item.date}</span>
            </div>
        `;
        grid.appendChild(card);
    });

    const totalBadge = document.getElementById('certTotalDisplay');
    if (totalBadge) totalBadge.textContent = certificatesData.length + "+";
}

let currentCertImgSrc = "";

function openCertModal(title, org, date, imgSrc) {
    const modal = document.getElementById('certPreviewModal');
    const modalTitle = document.getElementById('modalCertTitle');
    const modalOrg = document.getElementById('modalCertOrg');
    const modalDate = document.getElementById('modalCertDate');
    const downloadBtn = document.getElementById('downloadCertBtn');
    const viewFullBtn = document.getElementById('viewFullBtn');
    const imgContainer = document.getElementById('modalImgContainer');

    currentCertImgSrc = imgSrc;

    modalTitle.textContent = title;
    modalOrg.textContent = org;
    modalDate.textContent = date;

    imgContainer.innerHTML = `<img id="modalCertImg" src="${imgSrc}" alt="${title}" style="max-width:100%; max-height:68vh; border-radius:8px; display:block; margin:auto; background:#fff;">`;
    const modalImg = document.getElementById('modalCertImg');

    downloadBtn.style.display = 'inline-flex';
    viewFullBtn.style.display = 'inline-flex';

    modalImg.onerror = function() {
        modalImg.style.display = 'none';
        imgContainer.innerHTML = '<div style="padding: 40px; text-align: center; color: #94a3b8;"><i class="fas fa-image" style="font-size: 50px; color: #38bdf8; margin-bottom: 10px; display: block;"></i> Certificate verified & stored in portfolio credentials.</div>';
        downloadBtn.style.display = 'none';
        viewFullBtn.style.display = 'none';
    };

    modal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function toggleFullScreenImg() {
    const img = document.getElementById('modalCertImg');
    if (!img) return;

    if (!document.fullscreenElement) {
        if (img.requestFullscreen) {
            img.requestFullscreen();
        } else if (img.webkitRequestFullscreen) {
            img.webkitRequestFullscreen();
        } else if (img.msRequestFullscreen) {
            img.msRequestFullscreen();
        }
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

function triggerDownloadCert() {
    if (!currentCertImgSrc) return;

    fetch(currentCertImgSrc)
        .then(response => {
            if (!response.ok) throw new Error("Network error");
            return response.blob();
        })
        .then(blob => {
            const blobUrl = window.URL.createObjectURL(blob);
            const tempLink = document.createElement('a');
            tempLink.style.display = 'none';
            tempLink.href = blobUrl;
            tempLink.download = currentCertImgSrc.split('/').pop() || 'certificate.jpg';
            document.body.appendChild(tempLink);
            tempLink.click();
            setTimeout(() => {
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(tempLink);
            }, 100);
        })
        .catch(() => {
            const fallbackLink = document.createElement('a');
            fallbackLink.href = currentCertImgSrc;
            fallbackLink.setAttribute('download', '');
            fallbackLink.target = '_blank';
            fallbackLink.click();
        });
}

function closeCertModal() {
    const modal = document.getElementById('certPreviewModal');
    if (modal) {
        modal.style.display = 'none';
        document.body.style.overflow = 'auto';
    }
}

window.addEventListener('click', function(event) {
    const modal = document.getElementById('certPreviewModal');
    if (event.target === modal) closeCertModal();
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") closeCertModal();
});

document.addEventListener('DOMContentLoaded', function () {
    const yearElem = document.getElementById('year');
    if (yearElem) yearElem.textContent = new Date().getFullYear();
    renderCertificates(certificatesData);

    const searchInput = document.getElementById('certSearch');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const yearSelect = document.getElementById('certYearSelect');

    function executeFilter() {
        const query = searchInput.value.toLowerCase().trim();
        const activeBtn = document.querySelector('.filter-btn.active');
        const activeCategory = activeBtn ? activeBtn.getAttribute('data-category') : 'all';
        const selectedYear = yearSelect.value;

        const filtered = certificatesData.filter(item => {
            const matchesSearch = item.title.toLowerCase().includes(query) || item.org.toLowerCase().includes(query);
            const matchesCat = (activeCategory === 'all') || item.category.includes(activeCategory);
            const matchesYear = (selectedYear === 'all') || (item.year === selectedYear);
            return matchesSearch && matchesCat && matchesYear;
        });

        renderCertificates(filtered);
    }

    filterButtons.forEach(btn => {
        btn.addEventListener('click', function () {
            filterButtons.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            executeFilter();
        });
    });

    if (searchInput) searchInput.addEventListener('input', executeFilter);
    if (yearSelect) yearSelect.addEventListener('change', executeFilter);
});

// ===== ABOUT IMAGE AUTO-SLIDER ENGINE =====
let currentSlideIndex = 0;
let slideTimer;

function showSlide(index) {
    const slides = document.querySelectorAll(".about-slide");
    const dots = document.querySelectorAll(".about-slider-dots .dot");
    
    if (!slides.length) return;

    if (index >= slides.length) {
        currentSlideIndex = 0;
    } else if (index < 0) {
        currentSlideIndex = slides.length - 1;
    } else {
        currentSlideIndex = index;
    }

    slides.forEach(slide => slide.classList.remove("active"));
    dots.forEach(dot => dot.classList.remove("active"));

    slides[currentSlideIndex].classList.add("active");
    if (dots[currentSlideIndex]) {
        dots[currentSlideIndex].classList.add("active");
    }
}

function nextSlide() {
    showSlide(currentSlideIndex + 1);
}

function setSlide(index) {
    clearInterval(slideTimer);
    showSlide(index);
    slideTimer = setInterval(nextSlide, 3500);
}

document.addEventListener("DOMContentLoaded", function () {
    slideTimer = setInterval(nextSlide, 3500);
});

// Copy To Clipboard Function
function copyToClipboard(text, btnElement) {
    navigator.clipboard.writeText(text).then(() => {
        const originalHtml = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fas fa-check" style="color: #4ade80;"></i>';
        setTimeout(() => {
            btnElement.innerHTML = originalHtml;
        }, 2000);
    }).catch(err => {
        console.error("Failed to copy:", err);
    });
}

// Project Filtering Function
function filterProjects(category, btnElement) {
    const filterButtons = document.querySelectorAll('.proj-filter-btn');
    filterButtons.forEach(btn => btn.classList.remove('active'));
    btnElement.classList.add('active');

    const cards = document.querySelectorAll('.projects-container .project-card');
    cards.forEach(card => {
        const cardCat = card.getAttribute('data-category');
        if (category === 'all' || cardCat === category) {
            card.style.display = 'block';
        } else {
            card.style.display = 'none';
        }
    });
}

function openContactModal() {
    const modal = document.getElementById("contactMsgModal");
    if (modal) {
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }
}

function closeContactModal() {
    const modal = document.getElementById("contactMsgModal");
    if (modal) {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }
}

// ===== THEME TOGGLE ENGINE (DARK / LIGHT MODE) =====
const themeToggleBtn = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');

const savedTheme = localStorage.getItem('sudipta_theme') || 'dark';

if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    if (themeIcon) {
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
    }
}

if (themeToggleBtn) {
    themeToggleBtn.addEventListener('click', function () {
        const currentTheme = document.documentElement.getAttribute('data-theme');
        
        if (currentTheme === 'light') {
            document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('sudipta_theme', 'dark');
            themeIcon.classList.remove('fa-sun');
            themeIcon.classList.add('fa-moon');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            localStorage.setItem('sudipta_theme', 'light');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }
    });
}

// ===== SCROLL TO TOP ENGINE =====
const scrollTopBtn = document.getElementById("scrollTopBtn");

window.addEventListener("scroll", function () {
    if (scrollTopBtn) {
        if (window.scrollY > 400) {
            scrollTopBtn.classList.add("show");
        } else {
            scrollTopBtn.classList.remove("show");
        }
    }
});

function scrollToTop() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
